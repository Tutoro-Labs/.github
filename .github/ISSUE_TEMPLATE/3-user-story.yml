name: User Story
description: A slice of a feature a user can see, done within one sprint.
type: User Story
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      value: "As a … I want … so that …"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: builds-on
    attributes:
      label: Builds on
      description: Issues this story needs first; add them as "blocked by" links as well.
      placeholder: "- #42"
