name: Bug
description: Something that does not work as intended; link it under the feature it affects, or under the epic when no feature fits.
type: Bug
body:
  - type: markdown
    attributes:
      value: "Use invented data only: no real names, addresses or contact details in issues, logs or screenshots."
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Phone / desktop, browser, app version"
