name: Epic
description: A large goal that groups several features.
type: Epic
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is achieved once every feature of this epic is done?
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Features
      description: The features of this epic; link them as sub-issues as well.
      placeholder: "- #12"
